; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = neffy_esp32

[common]
platform = espressif32
board = neffy_mainboard                          ; from boards/ in this repo
board_build.variants_dir = variants              ; pins_arduino.h from variants/ in this repo
board_build.mcu = esp32s3
framework = arduino
board_upload.flash_size = 8MB
; Upload over the firmware's USB port: the 1200 baud touch reboots into the
; bootloader, which comes up as a new COM port that PlatformIO waits for
; (wait_for_upload_port in boards/neffy_mainboard.json). The firmware is then
; started by tools/reset_after_upload.py (see there why no normal reset).
board_upload.use_1200bps_touch = yes
board_upload.after_reset = no_reset
extra_scripts = post:tools/reset_after_upload.py
board_build.partitions = default_8MB.csv
board_build.psram = disabled
monitor_speed = 1000000

[env:neffy_esp32]
extends = common
monitor_speed = 115200
build_src_filter = -<*> +<neffy_esp32/>
lib_deps =
    https://github.com/LegitimateShake/Neffy_UART_Interface.git#f315d6b6d4a297f687b393e707671192f2c74b3b
    https://github.com/LegitimateShake/TMX222x_StepperDriver.git#0ccb229e21b554db60764576caf6169258448673
    fastled/FastLED@3.6.0

[env:neffy_led_test]
extends = common
build_flags = -I${PROJECT_SRC_DIR}/neffy_esp32
build_src_filter = -<*> +<tests/led/>
lib_deps = fastled/FastLED@3.6.0

[env:neffy_pressure_click_test]
extends = common
monitor_speed = 115200
build_src_filter = -<*> +<tests/pressure_click/> +<neffy_esp32/VoltageReader.cpp> +<neffy_esp32/PressureDetector.cpp>
build_flags = -I${PROJECT_SRC_DIR}/neffy_esp32
lib_deps =
    https://github.com/LegitimateShake/Neffy_UART_Interface.git#f315d6b6d4a297f687b393e707671192f2c74b3b
    fastled/FastLED@3.6.0

